

<!DOCTYPE html>
{% load static %}
<html>

<head>

    <title>Change Password</title>

    <link rel="stylesheet"
          href="{% static 'css/admin-auth.css' %}">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="logo">
            MEDICARE
        </div>

        <h1>Change Password</h1>

        <p class="subtitle">
            Update your administrator password
        </p>


        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>Current Password</label>

            <input
                type="password"
                name="old_password"
                required
            >


            <label>New Password</label>

            <input
                type="password"
                name="new_password"
                required
            >


            <label>Confirm New Password</label>

            <input
                type="password"
                name="confirm_password"
                required
            >


            <button type="submit">
                Update Password
            </button>

        </form>


        <div class="auth-links">

            <a href="{% url 'appointment_dashboard' %}">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
